
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
}

.login-box {
    background: white;
    padding: 40px;
    border-radius: 16px;
    width: 90%;
    max-width: 380px;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

h2 {
    text-align: center;
    color: #111827;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
    font-size: 14px;
}

label {
    display: block;
    margin: 15px 0 7px;
    color: #374151;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,.15);
}

button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.footer {
    text-align: center;
    font-size: 12px;
    color: #9ca3af;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>Bienvenido</h2>
    <p class="subtitle">Inicia sesión en tu cuenta</p>

    <form id="loginForm">

        <label for="email">Correo electrónico</label>
        <input
            type="email"
            id="email"
            placeholder="correo@ejemplo.com"
            required
        >

        <label for="password">Contraseña</label>
        <input
            type="password"
            id="password"
            placeholder="Ingresa tu contraseña"
            required
        >

        <button type="submit">Iniciar sesión</button>

    </form>

    <p id="message"></p>

    <div class="footer">
        Inicio de sesión de demostración
    </div>

</div>

<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    message.style.color = "#16a34a";
    message.textContent = "Formulario enviado correctamente.";

    // No se guarda ni se transmite la contraseña.
    // Este login es solamente una demostración.
    console.log("Evento de login de demostración:", {
        email: email,
        fecha: new Date().toLocaleString()
    });

    form.reset();
});
</script>

</body>
</html>
